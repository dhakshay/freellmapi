<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeLLM Chat</title>
<style>
  /* Layout: slide-in chat list on the left, message column in the middle, composer pinned to the bottom */
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --fg: #1a2030; --muted: #667085; --line: #dde1e8;
    --accent: #2457d6; --accent-fg: #ffffff; --user: #e6edff; --code: #eef0f4; --danger: #b42318;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #171b22; --fg: #e6e9ef; --muted: #8b95a7; --line: #2a303b;
    --accent: #6c93ff; --accent-fg: #0e1116; --user: #1f2a44; --code: #20262f; --danger: #ff7b6e; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0e1116; --panel: #171b22; --fg: #e6e9ef; --muted: #8b95a7; --line: #2a303b;
    --accent: #6c93ff; --accent-fg: #0e1116; --user: #1f2a44; --code: #20262f; --danger: #ff7b6e; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #app { height: 100%; display: flex; }
  aside { width: 280px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; display: flex; gap: 8px; }
  #chats { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .chat-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .chat-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-item:hover { background: var(--bg); }
  .chat-item.active { background: var(--user); }
  .chat-item button { visibility: hidden; padding: 2px 6px; }
  .chat-item:hover button, .chat-item.active button { visibility: visible; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .top h1 { font-size: 1rem; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu { display: none; }
  #log { flex: 1; overflow-y: auto; padding: 16px 12px; }
  .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 12px; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); align-self: flex-end; max-width: 88%; white-space: pre-wrap; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--line); }
  .msg.assistant p { margin: 0 0 .6em; } .msg.assistant p:last-child { margin: 0; }
  .msg pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; font: .85rem/1.4 var(--mono); }
  .msg code { background: var(--code); padding: 1px 5px; border-radius: 4px; font: .88em var(--mono); }
  .msg pre code { background: none; padding: 0; }
  .meta { color: var(--muted); font-size: .75rem; margin-top: 6px; }
  .err { color: var(--danger); }
  .empty { margin: 14vh auto 0; text-align: center; color: var(--muted); max-width: 460px; }
  .empty h2 { color: var(--fg); margin: 0 0 6px; }
  form { padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--panel); }
  .row { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; max-height: 40vh; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  select, input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
  button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: min(440px, calc(100vw - 32px)); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog label { display: block; margin: 12px 0 4px; font-size: .85rem; color: var(--muted); }
  dialog input { width: 100%; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  @media (max-width: 760px) {
    aside { position: fixed; z-index: 5; inset: 0 auto 0 0; padding-top: env(safe-area-inset-top, 0px); transform: translateX(-100%); transition: transform .2s; }
    body.nav aside { transform: none; }
    #menu { display: inline-block; }
    #scrim { position: fixed; inset: 0; z-index: 4; background: rgba(0,0,0,.4); display: none; }
    body.nav #scrim { display: block; }
  }
  @media (prefers-reduced-motion: reduce) { aside { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <aside>
    <header><button class="primary" id="new" type="button" style="flex:1">New chat</button><button id="settingsBtn" type="button" aria-label="Settings">Settings</button></header>
    <div id="chats"></div>
  </aside>
  <div id="scrim"></div>
  <main>
    <div class="top">
      <button id="menu" type="button" aria-label="Chats">Chats</button>
      <h1 id="title">New chat</h1>
      <select id="model" aria-label="Model"></select>
    </div>
    <div id="log"><div class="col" id="msgs"></div></div>
    <form id="form">
      <div class="row">
        <textarea id="input" rows="1" placeholder="Message your free LLM router…" aria-label="Message"></textarea>
        <button class="primary" id="send" type="submit">Send</button>
      </div>
    </form>
  </main>
</div>

<dialog id="settings">
  <h2 style="margin:0 0 4px">Connect to FreeLLMAPI</h2>
  <div style="color:var(--muted);font-size:.9rem">Your server address and unified API key. They stay on this device.</div>
  <label for="base">Server URL</label>
  <input id="base" placeholder="http://localhost:3001" autocomplete="off" autocapitalize="off">
  <label for="key">Unified API key</label>
  <input id="key" type="password" placeholder="freellmapi-…" autocomplete="off">
  <label for="sys">System prompt (optional)</label>
  <input id="sys" placeholder="You are a helpful assistant.">
  <div class="actions"><button id="cancel" type="button">Cancel</button><button class="primary" id="save" type="button">Save</button></div>
</dialog>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var cfg = store.get('flc-cfg', { base: 'http://localhost:3001', key: '', sys: '', model: 'auto' });
  var chats = store.get('flc-chats', []);
  var cur = null, busy = false, ctrl = null;

  var MODES = ['auto', 'auto:smart', 'auto:fast', 'auto:reliable', 'auto:balanced'];

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function md(src) {
    var parts = src.split(/```/), out = '';
    parts.forEach(function (p, i) {
      if (i % 2) { out += '<pre><code>' + esc(p.replace(/^[^\n]*\n/, '')) + '</code></pre>'; return; }
      p = esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
      out += p.split(/\n{2,}/).map(function (b) { return b.trim() ? '<p>' + b.replace(/\n/g, '<br>') + '</p>' : ''; }).join('');
    });
    return out;
  }
  function save() { store.set('flc-chats', chats); }
  function current() { return chats.filter(function (c) { return c.id === cur; })[0]; }
  function newChat() {
    var c = { id: String(Date.now()), title: 'New chat', messages: [] };
    chats.unshift(c); cur = c.id; save(); render(); document.body.classList.remove('nav'); $('input').focus();
  }

  function renderList() {
    var el = $('chats'); el.textContent = '';
    chats.forEach(function (c) {
      var d = document.createElement('div'); d.className = 'chat-item' + (c.id === cur ? ' active' : '');
      var s = document.createElement('span'); s.textContent = c.title; d.appendChild(s);
      var x = document.createElement('button'); x.type = 'button'; x.textContent = '✕'; x.setAttribute('aria-label', 'Delete chat');
      x.onclick = function (e) { e.stopPropagation(); chats = chats.filter(function (k) { return k.id !== c.id; }); if (cur === c.id) cur = chats[0] ? chats[0].id : null; if (!cur) return newChat(); save(); render(); };
      d.appendChild(x);
      d.onclick = function () { cur = c.id; render(); document.body.classList.remove('nav'); };
      el.appendChild(d);
    });
  }
  function bubble(m) {
    var d = document.createElement('div'); d.className = 'msg ' + m.role;
    if (m.role === 'user') d.textContent = m.content; else d.innerHTML = md(m.content) + (m.meta ? '<div class="meta">' + esc(m.meta) + '</div>' : '');
    return d;
  }
  function render() {
    renderList();
    var c = current(), box = $('msgs'); box.textContent = '';
    $('title').textContent = c ? c.title : 'New chat';
    if (!c || !c.messages.length) {
      box.innerHTML = '<div class="empty"><h2>FreeLLM Chat</h2><p>Ask anything. Your server routes each message to a free model and falls back to the next provider when one is rate-limited.</p>' +
        (cfg.key ? '' : '<p class="err">Add your server URL and API key in Settings to start.</p>') + '</div>';
      return;
    }
    c.messages.forEach(function (m) { box.appendChild(bubble(m)); });
    $('log').scrollTop = $('log').scrollHeight;
  }

  function loadModels() {
    var sel = $('model'); sel.textContent = '';
    function add(v, label) { var o = document.createElement('option'); o.value = v; o.textContent = label || v; sel.appendChild(o); }
    MODES.forEach(function (m) { add(m); });
    sel.value = cfg.model;
    if (!cfg.key) return;
    fetch(cfg.base.replace(/\/+$/, '') + '/v1/models?execution_status=ready', { headers: { Authorization: 'Bearer ' + cfg.key } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.data) return;
        j.data.forEach(function (m) { if (MODES.indexOf(m.id) < 0 && m.id !== 'fusion') add(m.id); });
        sel.value = cfg.model;
        if (sel.value !== cfg.model) sel.value = 'auto';
      }).catch(function () {});
  }

  function send(text) {
    var c = current(); if (!c || busy) return;
    if (!cfg.key) { $('settings').showModal(); return; }
    c.messages.push({ role: 'user', content: text });
    if (c.messages.length === 1) c.title = text.slice(0, 40);
    var reply = { role: 'assistant', content: '' };
    c.messages.push(reply); save(); render();
    var node = $('msgs').lastChild, t0 = Date.now(), routed = '';
    busy = true; $('send').textContent = 'Stop'; ctrl = new AbortController();
    var msgs = c.messages.slice(0, -1).map(function (m) { return { role: m.role, content: m.content }; });
    if (cfg.sys) msgs.unshift({ role: 'system', content: cfg.sys });
    function paint() { node.innerHTML = md(reply.content || '…') + (reply.meta ? '<div class="meta">' + esc(reply.meta) + '</div>' : ''); $('log').scrollTop = $('log').scrollHeight; }
    fetch(cfg.base.replace(/\/+$/, '') + '/v1/chat/completions', {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
      body: JSON.stringify({ model: $('model').value, messages: msgs, stream: true })
    }).then(function (r) {
      routed = r.headers.get('x-routed-via') || '';
      if (!r.ok) return r.text().then(function (t) { throw new Error('HTTP ' + r.status + ' ' + t.slice(0, 200)); });
      var rd = r.body.getReader(), dec = new TextDecoder(), buf = '';
      function pump() {
        return rd.read().then(function (x) {
          if (x.done) return;
          buf += dec.decode(x.value, { stream: true });
          var lines = buf.split('\n'); buf = lines.pop();
          lines.forEach(function (l) {
            l = l.trim(); if (l.indexOf('data:') !== 0) return;
            var d = l.slice(5).trim(); if (d === '[DONE]') return;
            try { var j = JSON.parse(d); var delta = j.choices && j.choices[0] && j.choices[0].delta; if (delta && delta.content) { reply.content += delta.content; paint(); } } catch (e) {}
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (e) {
      if (e.name === 'AbortError') reply.content += reply.content ? '\n\n(stopped)' : '(stopped)';
      else reply.content = '<<ERR>>' + (e.message === 'Failed to fetch' ? 'Could not reach ' + cfg.base + '. Check the URL, that the server is running, and that this app\'s origin is in DASHBOARD_ORIGINS.' : e.message);
    }).then(function () {
      if (reply.content.indexOf('<<ERR>>') === 0) { c.messages.pop(); c.messages.pop(); node.className = 'msg assistant err'; node.textContent = reply.content.slice(7); save(); }
      else { reply.meta = ((Date.now() - t0) / 1000).toFixed(1) + 's' + (routed ? ' · ' + routed : ''); paint(); save(); }
      busy = false; ctrl = null; $('send').textContent = 'Send'; renderList();
    });
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) { ctrl && ctrl.abort(); return; }
    var t = $('input').value.trim(); if (!t) return;
    $('input').value = ''; $('input').style.height = 'auto'; send(t);
  });
  $('input').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && !('ontouchstart' in window)) { e.preventDefault(); $('form').requestSubmit(); } });
  $('input').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, window.innerHeight * 0.4) + 'px'; });
  $('new').onclick = newChat;
  $('menu').onclick = function () { document.body.classList.add('nav'); };
  $('scrim').onclick = function () { document.body.classList.remove('nav'); };
  $('model').onchange = function () { cfg.model = this.value; store.set('flc-cfg', cfg); };
  $('settingsBtn').onclick = function () { $('base').value = cfg.base; $('key').value = cfg.key; $('sys').value = cfg.sys; $('settings').showModal(); };
  $('cancel').onclick = function () { $('settings').close(); };
  $('save').onclick = function () {
    cfg.base = $('base').value.trim() || 'http://localhost:3001'; cfg.key = $('key').value.trim(); cfg.sys = $('sys').value.trim();
    store.set('flc-cfg', cfg); $('settings').close(); loadModels(); render();
  };

  if (!chats.length) newChat(); else { cur = chats[0].id; render(); }
  loadModels();
  if (!cfg.key) setTimeout(function () { $('settingsBtn').click(); }, 300);
})();
</script>
</body>
</html>
