<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  canvas { background: #1b1b1b; border: 2px solid #3a3; max-width: 95vw; }
  #info { margin: 12px; }
  button { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
</style>
</head>
<body>
<div id="info">Score: <span id="score">0</span> · Best: <span id="best">0</span> · Arrows/WASD or swipe</div>
<canvas id="c" width="400" height="400"></canvas>
<button id="restart">Restart</button>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
let snake, dir, nextDir, food, score, best = 0, timer, over;

function reset() {
  snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
  dir = nextDir = {x: 1, y: 0};
  score = 0; over = false;
  placeFood();
  clearInterval(timer);
  timer = setInterval(tick, 110);
  draw();
  document.getElementById('score').textContent = 0;
}
function placeFood() {
  do { food = {x: Math.floor(Math.random()*N), y: Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function tick() {
  dir = nextDir;
  const h = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || snake.some(s => s.x === h.x && s.y === h.y)) {
    over = true; clearInterval(timer); draw(); return;
  }
  snake.unshift(h);
  if (h.x === food.x && h.y === food.y) {
    score++;
    best = Math.max(best, score);
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
    placeFood();
  } else snake.pop();
  draw();
}
function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#e44';
  ctx.fillRect(food.x*S+2, food.y*S+2, S-4, S-4);
  snake.forEach((s, i) => { ctx.fillStyle = i ? '#4c4' : '#8f8'; ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2); });
  if (over) {
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff'; ctx.font = '28px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('Game over', cv.width/2, cv.height/2);
  }
}
function turn(x, y) { if (x !== -dir.x || y !== -dir.y) nextDir = {x, y}; }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') turn(0, -1);
  else if (k === 'arrowdown' || k === 's') turn(0, 1);
  else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
  else if (k === 'arrowright' || k === 'd') turn(1, 0);
  else return;
  e.preventDefault();
});
let t0;
cv.addEventListener('touchstart', e => { t0 = e.touches[0]; }, {passive: true});
cv.addEventListener('touchend', e => {
  const t = e.changedTouches[0], dx = t.clientX - t0.clientX, dy = t.clientY - t0.clientY;
  if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0); else turn(0, Math.sign(dy));
});
document.getElementById('restart').onclick = reset;
reset();
</script>
</body>
</html>
